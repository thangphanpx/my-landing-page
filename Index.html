    <div class="container">
      <div class="text-center">
        <ul class="nav nav-tabs justify-content-center" id="mainTabs" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders" type="button">🛒 Đơn Hàng</button>

          </li>

      <div class="tab-content" id="mainTabsContent">
        <!-- TAB ORDERS -->
        <div class="tab-pane fade show active" id="orders" role="tabpanel">
          <div class="card p-4 border-0">
            <h5 class="fw-bold mb-4">Tạo Đơn Hàng Mới & Gửi Báo Cáo</h5>
            <form id="orderForm">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label small fw-bold text-muted">CHỌN KHÁCH HÀNG</label>
                  <select id="order_customer" class="form-select py-2" required>
                    <option value="">-- Chọn khách hàng --</option>

                </div>
                <div class="col-md-4">

                </div>

                  <label class="form-label small fw-bold text-muted">SỐ LƯỢNG</label>
                  <input type="number" id="order_quantity" class="form-control py-2" value="1" min="1" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                  <button type="submit" class="btn btn-primary w-100 fw-bold py-2">TẠO ĐƠN</button>
